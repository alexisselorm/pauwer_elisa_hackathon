repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && uv run --frozen ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run --frozen ruff check --fix --exit-non-zero-on-fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy --strict (backend)
        entry: bash -c 'cd backend && uv run --frozen mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: pytest-unit
        name: pytest (unit)
        # No Docker and no LLM: the integration (testcontainers) and live tests run in CI.
        entry: bash -c 'cd backend && uv run --frozen pytest -m "not integration" -q'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
