# The whole demo: `docker compose up --build` (see README "Run the demo").
# Secrets and Slack tokens come from backend/.env (copy backend/.env.example).
# Ports are bound to 127.0.0.1 only.

x-backend: &backend
  build: ./backend
  image: kaiku-backend:local
  init: true
  restart: unless-stopped
  # Fixed upstream DNS: otherwise a container keeps the host's resolver from when it was
  # created, and a network change (wifi, VPN, sleep) breaks every lookup until it is
  # recreated, which silently cut the bot off from Slack. Service names still resolve.
  # On a network that blocks public DNS, set DNS_PRIMARY/DNS_SECONDARY in .env (next to this file).
  dns:
    - ${DNS_PRIMARY:-1.1.1.1}
    - ${DNS_SECONDARY:-8.8.8.8}
  env_file:
    - path: backend/.env
      required: true
  # Every backend service reads the corpus and Elisa's example: the api for seed/backfill/eval,
  # the slackbot for the capture loop and the telemetry gate (V4), the sim for its nodes.
  # A service that lists its own `volumes` replaces this list, so api and slackbot repeat it.
  volumes:
    - ./mock_data:/data/mock_data:ro
    - ./Elisa_SinceAI2026/ELISA_HIDDEN_KNOWLEDGE_EXAMPLE_2026:/data/elisa:ro
  environment: &backend-env
    # Inside compose these always win over backend/.env.
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-silentctx-local-dev}
    DATA_DIR: /data/mock_data
    ELISA_DIR: /data/elisa  # `kaiku replay` and `kaiku backfill --elisa-dir` default to it
    STATE_DIR: /state
    # Traces of every LLM call, pipeline step and agent tool call (UI-1).
    PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    PHOENIX_PUBLIC_URL: http://localhost:6006
    EVAL_RESULTS_DIR: /data/eval/results

services:
  neo4j:
    image: neo4j:2026.10.1-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-silentctx-local-dev}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  api:
    <<: *backend
    command: ["kaiku-api"]
    environment:
      <<: *backend-env
      SIM_URL: http://sim:8100  # live telemetry at "now" for check_conditions
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # REST + MCP at http://localhost:8000/mcp
    volumes:
      - ./mock_data:/data/mock_data:ro
      - ./Elisa_SinceAI2026/ELISA_HIDDEN_KNOWLEDGE_EXAMPLE_2026:/data/elisa:ro
      - ./eval:/data/eval  # writable: `kaiku eval run` writes /data/eval/results for the Scorecard
      - api-state:/state  # LangGraph SQLite checkpointer
    healthcheck:
      # /readyz is 200 when Neo4j answers and the schema is applied (degraded counts as up).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  slackbot:
    <<: *backend
    command: ["kaiku-slackbot"]
    environment:
      <<: *backend-env
      MCP_URL: http://api:8000/mcp  # the ops agent uses MCP only, like any other agent
      SIM_URL: http://sim:8100  # fault events for #noc-alarms, and the simulated bounce
      EMAIL_DROP_DIR: /data/email_drop  # drop a .eml here to capture it (BE-2.2)
    volumes:
      - ./mock_data:/data/mock_data:ro
      - ./Elisa_SinceAI2026/ELISA_HIDDEN_KNOWLEDGE_EXAMPLE_2026:/data/elisa:ro
      - ./email_drop:/data/email_drop:ro
    depends_on:
      api:
        condition: service_healthy
      sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/kaiku-slackbot.ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Traces: Arize Phoenix (OpenTelemetry). UI at http://localhost:6006, kept in a volume.
  # Auth is off because it binds to 127.0.0.1 only, like every other service here.
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/mnt/data

  # The console: live knowledge graph, capture traces, agent runs (UI-1).
  web:
    build: ./frontend
    image: kaiku-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  sim:
    <<: *backend
    command: ["kaiku-sim"]
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  neo4j-data:
  api-state:
  phoenix-data:
