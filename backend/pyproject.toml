[project]
name = "silentctx"
version = "0.1.0"
description = "Silent context layer: captures expert operational knowledge from Slack and email, served to agents over MCP"
readme = "README.md"
authors = [
    { name = "Phuc Tran", email = "tranthanhphuc042@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "asgi-correlation-id>=5.0.1",
    "dateparser>=1.5.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp==1.30.0",
    "neo4j>=6.4.1",
    "neo4j-python-migrations>=0.1.5",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "slack-bolt==1.30.0",
    "structlog>=26.1.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers[neo4j]>=4.15.0",
    "types-dateparser>=1.4.3.20260907",
]

[project.scripts]
silentctx = "silentctx.cli:app"
silentctx-api = "silentctx.cli:serve"
silentctx-slackbot = "silentctx.slack.bot:main"
silentctx-sim = "silentctx.sim.app:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "TID", "BLE"]
ignore = [
    "S101",  # assert is fine (tests, and type narrowing in handlers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake tokens and passwords in tests
# Vendor LLM SDKs are allowed only behind silentctx.llm (and in its tests).
"src/silentctx/llm/**" = ["TID251"]
"tests/test_llm.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "Vendor LLM SDKs live in silentctx.llm only."
"anthropic".msg = "Vendor LLM SDKs live in silentctx.llm only."
"langchain_openai".msg = "Vendor LLM SDKs live in silentctx.llm only."
"langchain_anthropic".msg = "Vendor LLM SDKs live in silentctx.llm only."

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# slack_bolt's Socket Mode handlers are not annotated.
module = ["silentctx.slack.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["testcontainers.*", "neo4j_python_migrations.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "integration: needs Docker (testcontainers Neo4j); deselect with -m 'not integration'",
    "live: calls the real LLMs from .env (costs tokens); run with -m live",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
