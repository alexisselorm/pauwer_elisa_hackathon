# NMS alarm policy (Zabbix / Netcool / Infrared / Blueeye / Uama / Nagios parity)
policy_version: "2026-03-11"
banks:
  - device: Zabbix
    silence_windows:
      - "02:00-03:00 Europe/Helsinki"
    mute_rules:
      - when: "change_approval in {approved, scheduled}"
        suppress: true
  - device: Netcool
    silence_windows:
      - "02:00-03:00 Europe/Helsinki"
    mute_rules:
      - when: "change_approval in {approved, scheduled}"
        suppress: true
  - device: Infrared
    silence_windows:
      - "02:00-03:00 Europe/Helsinki"
    mute_rules:
      - when: "change_approval in {approved, scheduled}"
        suppress: true
  - device: Blueeye
    silence_windows:
      - "02:00-03:00 Europe/Helsinki"
    mute_rules:
      - when: "change_approval in {approved, scheduled}"
        suppress: true
  - device: Uama
    silence_windows:
      - "02:00-03:00 Europe/Helsinki"
    mute_rules:
      - when: "change_approval in {approved, scheduled}"
        suppress: true
  - device: Nagios
    silence_windows:
      - "02:00-03:00 Europe/Helsinki"
    mute_rules:
      - when: "change_approval in {approved, scheduled}"
        suppress: true
thresholds:
  traffic_zero:
    # NOT configured here for transport nodes - see the interface-counters.yml attachment
    enabled: false
  optical_degrade:
    rx_power_dbm: {min: -9.0, max: 0.0}
  temperature:
    inlet_c: {min: 5, max: 30}
